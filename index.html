<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>無限工事区画 - 違和感探索ゲーム</title>
  <style>
    * { box-sizing: border-box; }
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
      touch-action: none;
    }

    body {
      position: fixed;
      inset: 0;
    }
    #game {
      display: block;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #111;
    }
    .ui {
      position: fixed;
      left: 16px;
      top: 16px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.45);
      border-radius: 12px;
      backdrop-filter: blur(6px);
      line-height: 1.6;
      user-select: none;
    }
    .message {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%);
      min-width: 280px;
      max-width: 760px;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(0,0,0,.7);
      border: 1px solid rgba(255,255,255,.22);
      text-align: center;
      font-size: 18px;
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
    }
    .message.show { opacity: 1; }
    .centerHelp {
      position: fixed;
      right: 16px;
      top: 16px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.45);
      border-radius: 12px;
      backdrop-filter: blur(6px);
      line-height: 1.7;
      color: #ddd;
      user-select: none;
    }
    button {
      margin-top: 8px;
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }
    .touchControls {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      display: none;
      gap: 12px;
      align-items: end;
      z-index: 20;
      user-select: none;
      touch-action: none;
    }

    .touchGroup {
      display: grid;
      gap: 6px;
      padding: 8px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.45);
      border-radius: 16px;
      backdrop-filter: blur(6px);
    }

    .movePad {
      grid-template-columns: 40px 40px 40px;
      grid-template-rows: 40px 40px;
    }

    .judgePad {
      grid-template-columns: 112px 112px;
      grid-template-rows: 58px;
    }

    .touchBtn {
      margin: 0;
      width: auto;
      min-width: 40px;
      min-height: 40px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(255,255,255,.16);
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      -webkit-tap-highlight-color: transparent;
    }

    .touchBtn:active,
    .touchBtn.active {
      background: rgba(255,255,255,.34);
      transform: translateY(1px);
    }

    .touchBtn.ok {
      background: rgba(50,150,80,.45);
    }

    .touchBtn.alert {
      background: rgba(180,60,60,.50);
    }

    .touchBtn.wide {
      min-width: 112px;
      min-height: 58px;
      border-radius: 14px;
      font-size: 16px;
      line-height: 1.2;
    }

    .touchSpacer {
      visibility: hidden;
    }

    @media (pointer: coarse), (max-width: 900px) {
      .touchControls {
        display: flex;
        bottom: auto;
      }

      .centerHelp {
        display: none;
      }

      .ui {
        left: 10px;
        top: 10px;
        transform: scale(.9);
        transform-origin: left top;
      }

      .message {
        bottom: 122px;
        font-size: 16px;
        max-width: calc(100vw - 24px);
      }
    }

    .rotateHint {
      position: fixed;
      left: 50%;
      top: 72px;
      transform: translateX(-50%);
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.2);
      color: #ddd;
      font-size: 13px;
      z-index: 25;
      display: none;
      pointer-events: none;
      white-space: nowrap;
    }

    @media (pointer: coarse) and (orientation: portrait) {
      .rotateHint {
        display: block;
      }
    }

    @media (pointer: coarse) and (orientation: landscape) {
      .touchControls {
        left: 0;
        width: 100vw;
        transform: none;
        justify-content: space-between;
        align-items: flex-end;
        padding: 0 14px;
        gap: 0;
        pointer-events: none;
      }

      .touchGroup {
        pointer-events: auto;
      }

      .movePad {
        grid-template-columns: 34px 34px 34px;
        grid-template-rows: 34px 34px;
      }

      .judgePad {
        display: grid;
        grid-template-columns: 92px;
        grid-template-rows: 46px 46px;
      }

      .touchBtn {
        min-width: 34px;
        min-height: 34px;
        font-size: 14px;
        border-radius: 9px;
      }

      .touchBtn.wide {
        min-width: 92px;
        min-height: 46px;
        font-size: 13px;
        border-radius: 12px;
      }

      .message {
        bottom: 10px;
        max-width: 55vw;
      }
    }

    @media (max-width: 700px) {
      .touchControls {
        width: calc(100vw - 16px);
        justify-content: space-between;
        gap: 6px;
        bottom: 8px;
      }

      .touchGroup {
        padding: 8px;
        gap: 6px;
      }

      .movePad {
        grid-template-columns: 34px 34px 34px;
        grid-template-rows: 34px 34px;
      }

      .judgePad {
        grid-template-columns: 88px 88px;
        grid-template-rows: 48px;
      }

      .touchBtn {
        min-width: 34px;
        min-height: 34px;
        font-size: 14px;
        border-radius: 9px;
      }

      .touchBtn.wide {
        min-width: 88px;
        min-height: 48px;
        border-radius: 12px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="ui">
    <div>現在の通路: <b id="floor">0</b> / 8</div>
    <div>状態: <b id="status">観察中</b></div>
    <button id="reset">最初から</button>
  </div>

  <div class="centerHelp">
    <b>操作</b><br>
    W / ↑：前へ進む<br>
    S / ↓：戻る<br>
    A / D：視線を左右<br>
    スマホ：画面下ボタン
  </div>

  <div id="message" class="message"></div>

  <div class="rotateHint">横向き推奨</div>

  <div class="touchControls" aria-label="スマホ操作">
    <div class="touchGroup movePad">
      <button class="touchBtn touchSpacer" type="button"> </button>
      <button class="touchBtn" type="button" data-key="KeyW">↑</button>
      <button class="touchBtn touchSpacer" type="button"> </button>
      <button class="touchBtn" type="button" data-key="KeyA">←</button>
      <button class="touchBtn" type="button" data-key="KeyS">↓</button>
      <button class="touchBtn" type="button" data-key="KeyD">→</button>
    </div>

    <div class="touchGroup judgePad">
      <button class="touchBtn wide ok" type="button" data-action="safe">異常<br>なし</button>
      <button class="touchBtn wide alert" type="button" data-action="abnormal">異常<br>あり</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const floorEl = document.getElementById('floor');
    const statusEl = document.getElementById('status');
    const messageEl = document.getElementById('message');

    const DESIGN_WIDTH = 1920;
    const DESIGN_HEIGHT = 1080;

    let width = DESIGN_WIDTH;
    let height = DESIGN_HEIGHT;
    let displayScale = 1;
    let currentFloor = 0;
    let playerZ = 0;
    let lookX = 0;
    let anomaly = null;
    let messageTimer = null;
    let gameClear = false;
    let gameOver = false;
    let transition = null;
    let transitionTimer = null;
    let awaitingJudgement = false;
    let wrongReview = false;
    let firstLoop = true;
    let consecutiveSafeLoops = 0;
    let lastAnomaly = null;
    let titleScreen = true;
    let titleStartTime = performance.now();
    let titleFade = false;
    let titleFadeStart = 0;
    let tutorialShown = true;
    let tutorialComplete = false;
    const discoveredAnomalies = new Set();



    const keys = new Set();

    const anomalyTypes = ['unguarded_opening', 'no_safety_harness', 'unguarded_lift', 'unsafe_slogan', 'loose_duct_hanger', 'single_worker_carry', 'carrier_missing_helmet', 'lift_on_step']; // 安全に関わる異変を追加していく。

    function resize() {
      // スマホChromeのURLバーを避けるため、visualViewportの「実際に見えている範囲」を使う。
      const viewport = window.visualViewport;
      const viewWidth = viewport ? viewport.width : window.innerWidth;
      const viewHeight = viewport ? viewport.height : window.innerHeight;
      const offsetTop = viewport ? viewport.offsetTop : 0;
      const offsetLeft = viewport ? viewport.offsetLeft : 0;

      const isTouchLayout = window.matchMedia('(pointer: coarse), (max-width: 900px)').matches;
      const isLandscapeTouch = isTouchLayout && viewWidth > viewHeight;
      const reservedBottom = isTouchLayout ? (isLandscapeTouch ? 78 : 138) : 0;
      const reservedTop = isTouchLayout ? 18 : 0;

      const availableHeight = Math.max(320, viewHeight - reservedBottom - reservedTop);

      displayScale = Math.min(
        viewWidth / DESIGN_WIDTH,
        availableHeight / DESIGN_HEIGHT
      );

      canvas.width = DESIGN_WIDTH;
      canvas.height = DESIGN_HEIGHT;

      const cssWidth = Math.round(DESIGN_WIDTH * displayScale);
      const cssHeight = Math.round(DESIGN_HEIGHT * displayScale);

      canvas.style.width = cssWidth + 'px';
      canvas.style.height = cssHeight + 'px';

      // 見えている領域の中央に配置しつつ、下部タッチUI分だけ上へ逃がす。
      const centerX = offsetLeft + viewWidth / 2;
      const centerY = offsetTop + reservedTop + availableHeight / 2;

      canvas.style.left = centerX + 'px';
      canvas.style.top = centerY + 'px';

      ctx.setTransform(1, 0, 0, 1, 0, 0);

      width = DESIGN_WIDTH;
      height = DESIGN_HEIGHT;

      requestAnimationFrame(updateTouchControlPosition);
    }


    function pcPropScale() {
      return window.matchMedia('(pointer: coarse), (max-width: 900px)').matches ? 1.0 : 1.3;
    }

    function mobileObjectScale() {
      return window.matchMedia('(pointer: coarse), (max-width: 900px)').matches ? 1.6 : 1.0;
    }

    function randInt(max) {
      return Math.floor(Math.random() * max);
    }

    function pickAnomalyType() {
      // 未発見の異常を出やすくする。ただし発見済みも抽選対象には残す。
      // 例：未発見は4票、発見済みは1票として抽選する。
      const pool = [];

      for (const type of anomalyTypes) {
        if (type === lastAnomaly && anomalyTypes.length > 1) continue;

        const weight = discoveredAnomalies.has(type) ? 1 : 4;

        for (let i = 0; i < weight; i++) {
          pool.push(type);
        }
      }

      const fallbackPool = anomalyTypes.filter(type => type !== lastAnomaly);
      const finalPool = pool.length > 0 ? pool : (fallbackPool.length > 0 ? fallbackPool : anomalyTypes);

      const selected = finalPool[randInt(finalPool.length)];
      lastAnomaly = selected;
      return selected;
    }

    function makeAnomaly() {
      // 最初の1回は必ず正常状態
      if (firstLoop) {
        firstLoop = false;
        consecutiveSafeLoops = 1;
        return null;
      }

      // 2回連続正常なら次は強制異変
      if (consecutiveSafeLoops >= 2) {
        consecutiveSafeLoops = 0;
        return pickAnomalyType();
      }

      // 通常抽選
      if (Math.random() < 0.3) {
        consecutiveSafeLoops = 0;
        return pickAnomalyType();
      }

      consecutiveSafeLoops++;
      return null;
    }

    function nextLoop() {
      playerZ = 0;
      lookX = 0;
      awaitingJudgement = false;
      wrongReview = false;
      anomaly = makeAnomaly();
      statusEl.textContent = '観察中';
      floorEl.textContent = currentFloor;
    }

    function showMessage(text) {
      messageEl.textContent = text;
      messageEl.classList.add('show');
      clearTimeout(messageTimer);
      messageTimer = setTimeout(() => messageEl.classList.remove('show'), 1800);
    }

    function resetGame() {
      firstLoop = true;
      consecutiveSafeLoops = 0;
      lastAnomaly = null;
      currentFloor = 0;
      playerZ = 0;
      lookX = 0;
      gameClear = false;
      gameOver = false;
      transition = null;
      awaitingJudgement = false;
      wrongReview = false;
      clearTimeout(transitionTimer);
      nextLoop();
      showMessage('↑ 前進してください');
    }

    function judge(hasAnomaly) {
      if (gameClear || gameOver || transition || !awaitingJudgement) return;

      const correct = Boolean(anomaly) === hasAnomaly;

      if (!correct) {
        wrongReview = true;
        awaitingJudgement = false;
        keys.clear();

        if (anomaly) {
          showMessage('判断ミス。S / ↓で戻って異常を確認しよう。');
        } else {
          showMessage('判断ミス。S / ↓で戻って正常な状態を確認しよう。');
        }

        return;
      }

      if (hasAnomaly && anomaly) {
        discoveredAnomalies.add(anomaly);
      }

      if (currentFloor + 1 >= 8) {
        startTransition('clear', () => {
          currentFloor = 8;
          gameClear = true;
          statusEl.textContent = '脱出成功';
          floorEl.textContent = '8';
          showMessage('出口だ。あなたはループ通路から脱出した。');
        });
        return;
      }

      startTransition('next', () => {
        currentFloor++;
        nextLoop();
        showMessage('安全確認OK。次の区画へ進む。');
      });
    }

    function startTransition(type, afterDark) {
      transition = {
        type,
        alpha: 0,
        phase: 'fadeIn'
      };

      clearTimeout(transitionTimer);

      transitionTimer = setTimeout(() => {
        if (!transition) return;

        afterDark();
        transition.phase = 'hold';

        const holdTime = (type === 'wrong' || type === 'wrongReset') ? 2500 : 1500;

        transitionTimer = setTimeout(() => {
          if (!transition) return;
          transition.phase = 'fadeOut';

          transitionTimer = setTimeout(() => {
            transition = null;
          }, 500);
        }, holdTime);
      }, 260);
    }

    function drawCorridor() {
      const cx = width / 2 + lookX;
      const horizon = height * 0.30;
      const depth = 1 + playerZ * 1.8;

      // background
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#070707');
      grad.addColorStop(0.45, '#1b1b1b');
      grad.addColorStop(1, '#070707');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // tunnel points
      const nearW = width * 1.05;
      const nearH = height * 1.08;
      const farW = width * 0.08 * depth;
      const farH = height * 0.10 * depth;

      const nearLeft = cx - nearW / 2;
      const nearRight = cx + nearW / 2;
      const farLeft = cx - farW / 2;
      const farRight = cx + farW / 2;
      const nearTop = height * 0.04;
      const nearBottom = height * 0.97;
      const farTop = horizon - farH / 2;
      const farBottom = horizon + farH / 2;

      // ceiling
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.moveTo(nearLeft, nearTop);
      ctx.lineTo(nearRight, nearTop);
      ctx.lineTo(farRight, farTop);
      ctx.lineTo(farLeft, farTop);
      ctx.closePath();
      ctx.fill();

      // floor - コンクリート床
      ctx.fillStyle = '#6e6e6e';
      ctx.beginPath();
      ctx.moveTo(nearLeft, nearBottom);
      ctx.lineTo(nearRight, nearBottom);
      ctx.lineTo(farRight, farBottom);
      ctx.lineTo(farLeft, farBottom);
      ctx.closePath();
      ctx.fill();

      // コンクリートのムラ感
      ctx.strokeStyle = 'rgba(255,255,255,.05)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 18; i++) {
        const crackY = height * 0.58 + i * 22;
        ctx.beginPath();
        ctx.moveTo(width * 0.2 + Math.sin(i) * 12, crackY);
        ctx.lineTo(width * 0.8 + Math.cos(i * 1.3) * 8, crackY + Math.sin(i * 0.7) * 4);
        ctx.stroke();
      }

      // walls
      ctx.fillStyle = '#2b2b2b';
      ctx.beginPath();
      ctx.moveTo(nearLeft, nearTop);
      ctx.lineTo(farLeft, farTop);
      ctx.lineTo(farLeft, farBottom);
      ctx.lineTo(nearLeft, nearBottom);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#242424';
      ctx.beginPath();
      ctx.moveTo(nearRight, nearTop);
      ctx.lineTo(farRight, farTop);
      ctx.lineTo(farRight, farBottom);
      ctx.lineTo(nearRight, nearBottom);
      ctx.closePath();
      ctx.fill();

      // far exit frame
      ctx.strokeStyle = '#777';
      ctx.lineWidth = 3;
      ctx.strokeRect(farLeft, farTop, farW, farH);
      ctx.fillStyle = '#050505';
      ctx.fillRect(farLeft + 4, farTop + 4, farW - 8, farH - 8);

      // lights
      for (let i = 0; i < 5; i++) {
        const t = i / 5;
        const y = lerp(nearTop + 40, farTop + 8, t);
        const size = lerp(90, 18, t);
        const x = lerp(cx, cx, t);
        if (anomaly === 'missing_light' && i === 2) continue;
        ctx.fillStyle = 'rgba(255,245,200,.75)';
        ctx.fillRect(x - size / 2, y, size, size * 0.12);
        ctx.fillStyle = 'rgba(255,245,200,.08)';
        ctx.beginPath();
        ctx.ellipse(x, y + size * 0.06, size * 1.4, size * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      drawDetails(cx, farLeft, farRight, farTop, farBottom, nearLeft, nearRight, nearBottom);
      // 異変描画は後で追加する。今は正常状態だけを表示する。
      drawAnomaly(cx, farLeft, farRight, farTop, farBottom);

      // slight darkness vignette
      const vignette = ctx.createRadialGradient(width/2, height/2, width*0.2, width/2, height/2, width*0.75);
      vignette.addColorStop(0, 'rgba(0,0,0,0)');
      vignette.addColorStop(1, 'rgba(0,0,0,.72)');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, width, height);
    }

    function drawDetails(cx, farLeft, farRight, farTop, farBottom, nearLeft, nearRight, nearBottom) {
      // ダクト
      // 前進・後退に合わせて少しだけ近づくように動かす
      const ductMove = playerZ;
      const ductX = cx + lookX * 0.08;

      // ダクトは天井側にあるので、近づくほど画面上方向へ動く
      const ductY = height * (0.16 - ductMove * 0.03);

      // 近づく分だけ少し大きく見せる
      const ductW = width * 0.58 * mobileObjectScale() * (1 + ductMove * 0.12);

      drawDuct(ductX, ductY, ductW, anomaly === 'loose_duct_hanger');

      // 工事看板
      const safetyText = anomaly === 'unsafe_slogan'
        ? '本日も不安全に'
        : '本日もご安全に';
      // 工事看板も歩行に合わせて少しだけ近づきながら流れる
      const boardT = Math.pow(playerZ, 1.02);
      const boardX = cx - width * (0.28 + boardT * 0.10);
      const boardY = height * (0.38 + boardT * 0.09);
      const boardScale = mobileObjectScale() * pcPropScale() * (1 + boardT * 0.35);
      drawSafetyBoard(boardX, boardY, safetyText, boardScale);
      

      // 開口養生・立入禁止区画
      // 床の台形パースに同期させて、床上を通過して見えるようにする。
      const zoneT = Math.pow(playerZ, 1.05);
      const floorDepth = 0.76 + zoneT * 0.34;

      const floorLeftAtDepth = lerp(farLeft, nearLeft, floorDepth);
      const floorRightAtDepth = lerp(farRight, nearRight, floorDepth);
      const floorYAtDepth = lerp(farBottom, nearBottom, floorDepth);
      const floorWidthAtDepth = floorRightAtDepth - floorLeftAtDepth;

      const zoneX = floorLeftAtDepth + floorWidthAtDepth * 0.27;
      const zoneY = floorYAtDepth;
      const zoneScale = lerp(0.72, 1.65, zoneT);

      // 横を通過したら自然に画面外へ消える
      if (zoneY < height * 1.02 && zoneX > -width * 0.4) {
        const guarded = anomaly !== 'unguarded_opening';
        drawRestrictedZone(zoneX, zoneY, zoneScale * mobileObjectScale() * pcPropScale(), guarded);
      }

      // 高所作業車（開口と同じように通過してフレームアウト）
      const liftT = Math.pow(playerZ, 1.02);
      const liftDepth = 0.62 + liftT * 0.38;

      const liftFloorLeft = lerp(farLeft, nearLeft, liftDepth);
      const liftFloorRight = lerp(farRight, nearRight, liftDepth);
      const liftFloorY = lerp(farBottom, nearBottom, liftDepth);
      const liftFloorWidth = liftFloorRight - liftFloorLeft;

      const liftScale = lerp(0.95, 2.45, liftT) * pcPropScale();

      // 右側を追い抜くように通過
      const liftX = liftFloorLeft + liftFloorWidth * (0.80 + liftT * 0.22);
      const liftY = liftFloorY - 90 * liftScale;

      if (liftX < width * 1.45) {
        const harnessOn = anomaly !== 'no_safety_harness';

        const liftProgress = Math.min(1, playerZ * mobileObjectScale() * pcPropScale());
        const liftTilted = anomaly === 'lift_on_step';

        drawLiftStep(liftX, liftY, liftProgress, liftTilted);
        drawLiftWorker(liftX, liftY, liftProgress, harnessOn, liftTilted);

        // 高所作業車周囲の立入禁止区画
        const liftGuarded = anomaly !== 'unguarded_lift';
        drawLiftSafetyZone(
          liftX,
          liftY + 48 * lerp(0.85, 1.8, Math.pow(playerZ, 1.03)),
          liftProgress,
          liftGuarded
        );
      }

      // 長物運搬作業員（正常ギミック）
      drawLongMaterialCarry(cx, farLeft, farRight, farBottom, nearLeft, nearRight, nearBottom, anomaly === 'single_worker_carry', mobileObjectScale() * pcPropScale(), anomaly === 'carrier_missing_helmet');


      // 床ライン
      ctx.strokeStyle = 'rgba(255,255,255,.12)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 8; i++) {
        const y = height * (0.58 + i * 0.055) - playerZ * 24;
        ctx.beginPath();
        ctx.moveTo(width * 0.18, y);
        ctx.lineTo(width * 0.82, y);
        ctx.stroke();
      }
    }

    function drawDuct(x, y, w, looseHanger = false) {
      // ダクト本体
      ctx.fillStyle = '#777';
      ctx.fillRect(x - w/2, y, w, 36);

      ctx.strokeStyle = '#999';
      ctx.lineWidth = 2;
      ctx.strokeRect(x - w/2, y, w, 36);

      // 継ぎ目
      for (let i = 0; i < 8; i++) {
        ctx.strokeStyle = '#555';
        ctx.beginPath();

        const px = x - w/2 + i * (w/7);

        ctx.moveTo(px, y);
        ctx.lineTo(px, y + 36);

        ctx.stroke();
      }

      // 吊ボルト
      const rodPositions = [-0.32, 0, 0.32];

      for (let i = 0; i < rodPositions.length; i++) {
        const p = rodPositions[i];
        const rodX = x + w * p;

        // 異変：中央の吊ボルトだけ斜めに外れかけている
        const isLoose = looseHanger && i === 1;

        ctx.strokeStyle = '#cfcfcf';
        ctx.lineWidth = 4;

        ctx.beginPath();

        if (isLoose) {
          // 天井から少しズレて斜めに
          ctx.moveTo(rodX - 18, y - 120);
          ctx.lineTo(rodX + 10, y + 36);
        } else {
          ctx.moveTo(rodX, y - 120);
          ctx.lineTo(rodX, y + 36);
        }

        ctx.stroke();
      }
    }

    function drawSafetyBoard(x, y, text, scale = 1) {
      const boardW = 130 * scale;
      const boardH = 84 * scale;

      ctx.fillStyle = '#f2d000';
      ctx.fillRect(x - boardW / 2, y - boardH / 2, boardW, boardH);
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 4 * scale;
      ctx.strokeRect(x - boardW / 2, y - boardH / 2, boardW, boardH);

      ctx.fillStyle = '#111';
      ctx.font = `bold ${18 * scale}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(text, x, y + 6 * scale);
    }

    function drawRestrictedZone(x, y, scale = 1, guarded = true) {
      ctx.save();
      const holeW = 240 * scale;
      const holeH = 52 * scale;
      const coneOffset = 150 * scale;
      const coneDepth = 60 * scale;
      const barTop = 78 * scale;
      const barBottom = 42 * scale;

      // 開口
      ctx.fillStyle = '#050505';
      ctx.fillRect(x - holeW / 2, y - holeH / 2, holeW, holeH);

      // 黄色マーキング
      ctx.strokeStyle = '#f2d000';
      ctx.lineWidth = 6;
      ctx.strokeRect(x - holeW / 2 - 6 * scale, y - holeH / 2 - 6 * scale, holeW + 12 * scale, holeH + 12 * scale);

      // コーン・バー（養生ありの場合のみ表示）
      if (guarded) {
        const conePositions = [
          { x: -coneOffset, y: -coneDepth },
          { x: coneOffset, y: -coneDepth },
          { x: -coneOffset, y: coneDepth },
          { x: coneOffset, y: coneDepth }
        ];

        for (const pos of conePositions) {
          const coneX = x + pos.x;
          const coneY = y + pos.y;

          ctx.fillStyle = '#ff6a00';
          ctx.beginPath();
          ctx.moveTo(coneX, coneY - 42 * scale);
          ctx.lineTo(coneX - 24 * scale, coneY + 12 * scale);
          ctx.lineTo(coneX + 24 * scale, coneY + 12 * scale);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#fff';
          ctx.fillRect(coneX - 16 * scale, coneY - 6 * scale, 32 * scale, 8 * scale);
        }

        // バー（四辺を囲う）
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 8 * scale;

      // 上
      ctx.beginPath();
      ctx.moveTo(x - coneOffset, y - barTop);
      ctx.lineTo(x + coneOffset, y - barTop);
      ctx.stroke();

      // 下
      ctx.beginPath();
      ctx.moveTo(x - coneOffset, y + barBottom);
      ctx.lineTo(x + coneOffset, y + barBottom);
      ctx.stroke();

      // 左
      ctx.beginPath();
      ctx.moveTo(x - coneOffset, y - barTop);
      ctx.lineTo(x - coneOffset, y + barBottom);
      ctx.stroke();

      // 右
      ctx.beginPath();
      ctx.moveTo(x + coneOffset, y - barTop);
      ctx.lineTo(x + coneOffset, y + barBottom);
      ctx.stroke();

      }

      // 注意表示（養生ありの場合のみ表示）
      if (guarded) {
        const signOffsetY = 110 * scale;
        const signW = 180 * scale;
        const signH = 36 * scale;

        ctx.fillStyle = '#f2d000';
        ctx.fillRect(x - signW / 2, y - signOffsetY, signW, signH);
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 3 * scale;
        ctx.strokeRect(x - signW / 2, y - signOffsetY, signW, signH);

        ctx.fillStyle = '#111';
        ctx.font = `bold ${18 * scale}px sans-serif`;
        ctx.textAlign = 'center';

        // 開口通過時に看板も左へ流れる
        const signX = x - scale * 18;
        ctx.fillText('開口部注意', signX, y - signOffsetY + signH * 0.68);
      }

      ctx.restore();
    }

    

    function drawLiftStep(x, y, progress, visible = false) {
      if (!visible) return;

      const scale = lerp(0.85, 1.8, Math.pow(progress, 1.03));
      const baseW = 120 * scale;
      const baseH = 48 * scale;

      // 右タイヤが乗り上げている小さな段差
      const stepW = 78 * scale;
      const stepH = 26 * scale;
      const stepX = x + baseW * 0.32 - stepW / 2;
      const stepY = y + baseH + 10 * scale;

      ctx.save();
      ctx.fillStyle = '#9a9a9a';
      ctx.fillRect(stepX, stepY, stepW, stepH);

      ctx.strokeStyle = '#c8c8c8';
      ctx.lineWidth = 3 * scale;
      ctx.strokeRect(stepX, stepY, stepW, stepH);

      // 段差上面
      ctx.fillStyle = '#b8b8b8';
      ctx.beginPath();
      ctx.moveTo(stepX, stepY);
      ctx.lineTo(stepX + stepW, stepY);
      ctx.lineTo(stepX + stepW - 12 * scale, stepY - 12 * scale);
      ctx.lineTo(stepX + 12 * scale, stepY - 12 * scale);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawLiftWorker(x, y, progress, harnessOn = true, tilted = false) {
      const t = Math.pow(progress, 1.03);
      const scale = lerp(0.85, 1.8, t);

      const baseW = 120 * scale;
      const baseH = 48 * scale;
      const boomH = 180 * scale;

      if (tilted) {
        ctx.save();
        // 右タイヤが段差に乗り上げた想定で、車体全体を少し左下がりに傾ける
        ctx.translate(x, y + baseH);
        ctx.rotate(-0.13);
        ctx.translate(-x, -(y + baseH));
      }

      // 車体
      ctx.fillStyle = '#ffb300';
      ctx.fillRect(x - baseW / 2, y, baseW, baseH);

      ctx.strokeStyle = '#333';
      ctx.lineWidth = 3 * scale;
      ctx.strokeRect(x - baseW / 2, y, baseW, baseH);

      // タイヤ
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(x - baseW * 0.32, y + baseH, 14 * scale, 0, Math.PI * 2);
      ctx.arc(x + baseW * 0.32, y + baseH, 14 * scale, 0, Math.PI * 2);
      ctx.fill();

      // ブーム
      ctx.strokeStyle = '#d8d8d8';
      ctx.lineWidth = 8 * scale;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y - boomH);
      ctx.stroke();

      // 作業かご
      const cageX = x;
      const cageY = y - boomH;
      const cageW = 150 * scale;
      const cageH = 82 * scale;

      // かご床（省略して手すり中心にする）

      // 手すり
      ctx.strokeStyle = '#d8d8d8';
      ctx.lineWidth = 5 * scale;
      ctx.strokeRect(cageX - cageW / 2, cageY - cageH, cageW, cageH);

      // 中桟
      ctx.beginPath();
      ctx.moveTo(cageX - cageW / 2, cageY - cageH * 0.45);
      ctx.lineTo(cageX + cageW / 2, cageY - cageH * 0.45);
      ctx.stroke();

      // 安全帯取付ポイント
      ctx.fillStyle = '#bbb';
      ctx.beginPath();
      ctx.arc(cageX + cageW * 0.35, cageY - cageH + 8 * scale, 5 * scale, 0, Math.PI * 2);
      ctx.fill();

      // 作業員
      const workerY = cageY - cageH + 8 * scale;

      // ヘルメットは最後に最前面で描画

      // 顔
      ctx.fillStyle = '#f5c9a5';
      ctx.beginPath();
      ctx.arc(x, workerY - 12 * scale, 10 * scale, 0, Math.PI * 2);
      ctx.fill();

      // 胴体（安全ベスト）
      ctx.fillStyle = '#00d0ff';
      ctx.fillRect(x - 12 * scale, workerY - 2 * scale, 24 * scale, 42 * scale);

      // 反射帯
      ctx.fillStyle = '#d8ffff';
      ctx.fillRect(x - 12 * scale, workerY + 8 * scale, 24 * scale, 5 * scale);
      ctx.fillRect(x - 12 * scale, workerY + 24 * scale, 24 * scale, 5 * scale);

      // 足
      ctx.strokeStyle = '#1e3a5f';
      ctx.lineWidth = 6 * scale;
      ctx.beginPath();
      ctx.moveTo(x - 6 * scale, workerY + 40 * scale);
      ctx.lineTo(x - 10 * scale, workerY + 68 * scale);
      ctx.moveTo(x + 6 * scale, workerY + 40 * scale);
      ctx.lineTo(x + 10 * scale, workerY + 68 * scale);
      ctx.stroke();

      // 腕（長袖）
      ctx.strokeStyle = '#00d0ff';
      ctx.lineWidth = 8 * scale;
      ctx.beginPath();
      // 左腕削除
      ctx.moveTo(x + 12 * scale, workerY + 10 * scale);
      ctx.lineTo(x + 28 * scale, workerY - 8 * scale);
      ctx.stroke();

      // 手袋
      ctx.fillStyle = '#d8d8d8';
      ctx.beginPath();
      ctx.arc(x + 28 * scale, workerY - 8 * scale, 5 * scale, 0, Math.PI * 2);
      ctx.fill();

      // 工具
      ctx.strokeStyle = '#ccc';
      ctx.lineWidth = 3 * scale;
      ctx.beginPath();
      ctx.moveTo(x + 28 * scale, workerY - 8 * scale);
      ctx.lineTo(x + 42 * scale, workerY - 20 * scale);
      ctx.stroke();

      // 安全帯（腰ベルト型）
      if (harnessOn) {
        // 腰ベルト
        ctx.strokeStyle = '#ff2d2d';
        ctx.lineWidth = 7 * scale;
        ctx.beginPath();
        ctx.moveTo(x - 18 * scale, workerY + 30 * scale);
        ctx.lineTo(x + 18 * scale, workerY + 30 * scale);
        ctx.stroke();

        // バックル
        ctx.fillStyle = '#ddd';
        ctx.fillRect(x - 4 * scale, workerY + 26 * scale, 8 * scale, 8 * scale);

        // D環
        ctx.strokeStyle = '#ddd';
        ctx.lineWidth = 3 * scale;
        ctx.beginPath();
        ctx.arc(x + 18 * scale, workerY + 30 * scale, 5 * scale, 0, Math.PI * 2);
        ctx.stroke();

        // ランヤード（少したるませる）
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 6 * scale;
        ctx.beginPath();
        ctx.moveTo(x + 22 * scale, workerY + 30 * scale);
        ctx.quadraticCurveTo(
          x + 58 * scale,
          workerY + 52 * scale,
          cageX + cageW * 0.35,
          cageY - cageH + 8 * scale
        );
        ctx.stroke();

        // フック金具（現場の安全帯っぽい形状）
        const hookX = cageX + cageW * 0.35;
        const hookY = cageY - cageH + 8 * scale;

        ctx.strokeStyle = '#dcdcdc';
        ctx.lineWidth = 4 * scale;

        // 本体
        ctx.beginPath();
        ctx.moveTo(hookX - 16 * scale, hookY + 2 * scale);
        ctx.lineTo(hookX - 2 * scale, hookY - 10 * scale);
        ctx.lineTo(hookX + 14 * scale, hookY - 4 * scale);
        ctx.lineTo(hookX + 10 * scale, hookY + 12 * scale);
        ctx.lineTo(hookX - 6 * scale, hookY + 16 * scale);
        ctx.closePath();
        ctx.stroke();

        // 開閉ゲート
        ctx.beginPath();
        ctx.moveTo(hookX + 6 * scale, hookY - 2 * scale);
        ctx.lineTo(hookX + 18 * scale, hookY - 12 * scale);
        ctx.stroke();

        // 接続リング
        ctx.beginPath();
        ctx.moveTo(hookX - 18 * scale, hookY + 4 * scale);
        ctx.lineTo(hookX - 28 * scale, hookY + 4 * scale);
        ctx.stroke();
      }

      // 前側手すり（人物より手前に描画）
      ctx.strokeStyle = '#f0f0f0';
      ctx.lineWidth = 7 * scale;

      ctx.beginPath();
      ctx.moveTo(cageX - cageW / 2, cageY);
      ctx.lineTo(cageX + cageW / 2, cageY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cageX - cageW / 2, cageY - cageH);
      ctx.lineTo(cageX - cageW / 2, cageY);
      ctx.moveTo(cageX + cageW / 2, cageY - cageH);
      ctx.lineTo(cageX + cageW / 2, cageY);
      ctx.stroke();

      // 安全帯を最前面に再描画
      if (harnessOn) {
        // 腰ベルト
        ctx.strokeStyle = '#ff2d2d';
        ctx.lineWidth = 7 * scale;
        ctx.beginPath();
        ctx.moveTo(x - 18 * scale, workerY + 30 * scale);
        ctx.lineTo(x + 18 * scale, workerY + 30 * scale);
        ctx.stroke();

        // ランヤード
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 6 * scale;
        ctx.beginPath();
        ctx.moveTo(x + 22 * scale, workerY + 30 * scale);
        ctx.quadraticCurveTo(
          x + 58 * scale,
          workerY + 52 * scale,
          cageX + cageW * 0.35,
          cageY - cageH + 8 * scale
        );
        ctx.stroke();
      }

      // 腕（長袖・前面）
      ctx.strokeStyle = '#00d0ff';
      ctx.lineWidth = 8 * scale;
      ctx.beginPath();
      ctx.moveTo(x, workerY + 6 * scale);
      ctx.lineTo(x + 18 * scale, workerY - 6 * scale);
      ctx.stroke();

      // 手袋
      ctx.fillStyle = '#d8d8d8';
      ctx.beginPath();
      ctx.arc(x + 18 * scale, workerY - 6 * scale, 5 * scale, 0, Math.PI * 2);
      ctx.fill();

      // ヘルメット（少し深く被る）
      ctx.fillStyle = '#2f7dd3';
      ctx.beginPath();
      ctx.arc(x, workerY - 18 * scale, 14 * scale, Math.PI, 0);
      ctx.lineTo(x + 16 * scale, workerY - 16 * scale);
      ctx.lineTo(x - 16 * scale, workerY - 16 * scale);
      ctx.closePath();
      ctx.fill();

      if (tilted) {
        ctx.restore();
      }
    }

    function drawLiftSafetyZone(x, y, progress, guarded = true) {
      const scale = lerp(0.85, 1.8, Math.pow(progress, 1.03));

      const zoneW = 300 * scale;
      const zoneH = 90 * scale;

      const left = x - zoneW / 2;
      const right = x + zoneW / 2;
      const top = y - zoneH * 0.25;
      const bottom = y + zoneH * 0.25;

      const coneSize = 24 * scale;

      const cones = [
        [left, top],
        [right, top],
        [left, bottom],
        [right, bottom]
      ];

      if (guarded) {
      // コーン
      for (const [cx, cy] of cones) {
        ctx.fillStyle = '#ffd000';
        ctx.beginPath();
        ctx.moveTo(cx, cy - coneSize);
        ctx.lineTo(cx - coneSize * 0.6, cy + coneSize * 0.4);
        ctx.lineTo(cx + coneSize * 0.6, cy + coneSize * 0.4);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.fillRect(cx - coneSize * 0.4, cy - coneSize * 0.1, coneSize * 0.8, coneSize * 0.18);
      }

      // バー（中央だけ高所作業車で隠す）
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 6 * scale;

      const hiddenHalf = 72 * scale;

      ctx.beginPath();

      // 奥側バー 左
      ctx.moveTo(left, top);
      ctx.lineTo(x - hiddenHalf, top);

      // 奥側バー 右
      ctx.moveTo(x + hiddenHalf, top);
      ctx.lineTo(right, top);

      // 手前バー
      ctx.moveTo(left, bottom);
      ctx.lineTo(right, bottom);

      // 左側
      ctx.moveTo(left, top);
      ctx.lineTo(left, bottom);

      // 右側
      ctx.moveTo(right, top);
      ctx.lineTo(right, bottom);

      ctx.stroke();
      }
    }

    function drawLongMaterialCarry(cx, farLeft, farRight, farBottom, nearLeft, nearRight, nearBottom, singleCarry = false, objectScale = 1, missingHelmet = false) {
      // 通路奥から少し手前を、作業員2人で長物を運んでいる正常ギミック
      const t = Math.pow(playerZ, 1.02);
      const depth = 0.50 + t * 0.18;

      const floorLeft = lerp(farLeft, nearLeft, depth);
      const floorRight = lerp(farRight, nearRight, depth);
      const floorY = lerp(farBottom, nearBottom, depth);
      const floorWidth = floorRight - floorLeft;

      const scale = lerp(0.62, 1.18, t) * objectScale;

      // 画面左寄りから中央へ見える位置
      const centerX = floorLeft + floorWidth * 0.43;
      const baseY = floorY - 4 * scale;

      const workerGap = 420 * scale;
      const worker1X = centerX - workerGap / 2;
      const worker2X = centerX + workerGap / 2;

      // 長物：3mくらいの鋼材・角パイプ想定
      const materialLength = 620 * scale;
      const materialY = baseY - 104 * scale;
      const materialAngle = -0.05;

      ctx.save();
      ctx.translate(centerX, materialY);
      ctx.rotate(materialAngle);

      // 角パイプ本体
      ctx.fillStyle = '#b9b9b9';
      ctx.fillRect(-materialLength / 2, -7 * scale, materialLength, 14 * scale);

      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 2 * scale;
      ctx.strokeRect(-materialLength / 2, -7 * scale, materialLength, 14 * scale);

      // 端面
      ctx.fillStyle = '#8a8a8a';
      ctx.fillRect(-materialLength / 2 - 5 * scale, -7 * scale, 5 * scale, 14 * scale);
      ctx.fillRect(materialLength / 2, -7 * scale, 5 * scale, 14 * scale);

      ctx.restore();

      // 異変：1人だけで無理に長物を運搬
      if (singleCarry) {
        drawCarrierWorker(centerX, baseY, scale, 1, true);


      } else {
        // 異常：2人運搬のうち片方だけヘルメット未着用
        drawCarrierWorker(worker1X, baseY, scale, 1, !missingHelmet);
        drawCarrierWorker(worker2X, baseY, scale, -1, true);
      }
    }

    function drawDoor(x, y, w, h) {
      ctx.fillStyle = '#111';
      ctx.fillRect(x - w/2, y - h/2, w, h);
      ctx.strokeStyle = '#666';
      ctx.strokeRect(x - w/2, y - h/2, w, h);
      ctx.fillStyle = '#999';
      ctx.beginPath();
      ctx.arc(x + w * 0.27, y + 12, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawAnomaly(cx) {
      if (!anomaly) return;

      if (anomaly === 'wet_duct') {
        ctx.fillStyle = 'rgba(0,120,255,.5)';
        ctx.beginPath();
        ctx.ellipse(cx, height * 0.22, 220, 40, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      if (anomaly === 'unguarded_opening') {
        // drawRestrictedZone側で養生を消す
      }

      if (anomaly === 'danger_sign') {
        drawSafetyBoard(cx + width * 0.26, height * 0.45, '帰れると思うな');
      }

      if (anomaly === 'helmet_shadow') {
        ctx.fillStyle = 'rgba(0,0,0,.78)';
        ctx.beginPath();
        ctx.arc(cx + width * 0.2, height * 0.56, 42, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(cx + width * 0.2 - 34, height * 0.56, 68, 120);
      }

      if (anomaly === 'bent_thread_rod') {
        ctx.strokeStyle = '#bbb';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(cx - width * 0.33, height * 0.18);
        ctx.bezierCurveTo(cx - width * 0.28, height * 0.28, cx - width * 0.42, height * 0.34, cx - width * 0.31, height * 0.52);
        ctx.stroke();
      }

      if (anomaly === 'open_hatch') {
        ctx.fillStyle = '#000';
        ctx.fillRect(cx + width * 0.36 - 44, height * 0.62 - 44, 88, 88);
        ctx.strokeStyle = '#999';
        ctx.strokeRect(cx + width * 0.36 - 44, height * 0.62 - 44, 88, 88);
      }
    }

    function lerp(a, b, t) { return a + (b - a) * t; }

    function update() {
      if (!gameClear && !gameOver && !transition) {
        if (!awaitingJudgement && (keys.has('KeyW') || keys.has('ArrowUp'))) {
          playerZ += 0.018;
        }

        if (keys.has('KeyS') || keys.has('ArrowDown')) {
          playerZ -= 0.018;

          if (awaitingJudgement && playerZ < 0.96) {
            awaitingJudgement = false;
          }

        }

        if (keys.has('KeyA')) lookX += 4;
        if (keys.has('KeyD')) lookX -= 4;

        playerZ = Math.max(0, Math.min(1, playerZ));
        lookX *= 0.92;
      }
    }

    function draw() {
      drawCorridor();

      if (playerZ >= 1 && !gameClear && !awaitingJudgement && !transition && !wrongReview) {
        awaitingJudgement = true;
        keys.clear();
      }

      if (wrongReview && !gameClear) {
        ctx.fillStyle = 'rgba(130,0,0,.52)';
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('判断ミス', width / 2, height / 2 - 42);

        ctx.font = '20px sans-serif';
        const reviewText = anomaly
          ? 'S / ↓：戻って異常を確認'
          : 'S / ↓：戻って正常な状態を確認';

        ctx.fillText(reviewText, width / 2, height / 2 + 8);
        ctx.fillText('Enter：最初の通路へ戻る', width / 2, height / 2 + 44);
      }

      if (awaitingJudgement && !gameClear) {
        ctx.fillStyle = 'rgba(0,0,0,.48)';
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';

        if (currentFloor === 0 && !tutorialComplete) {
          ctx.font = 'bold 42px sans-serif';
          ctx.fillText('✓ 正常な工事区画です', width / 2, height / 2 - 60);

          ctx.font = '28px sans-serif';
          ctx.fillText('今後はこの状態を基準に', width / 2, height / 2);
          ctx.fillText('異常を探してください', width / 2, height / 2 + 40);

          ctx.font = '24px sans-serif';
          ctx.fillText('S / ↓：戻って確認する', width / 2, height / 2 + 100);
          ctx.fillText('Enter：開始', width / 2, height / 2 + 140);
        } else {
          ctx.font = 'bold 32px sans-serif';
          ctx.fillText('異常はあったか？', width / 2, height / 2 - 42);

          ctx.font = '20px sans-serif';
          ctx.fillText('Enter：異常なし / Space：異常あり', width / 2, height / 2 + 8);
          ctx.fillText('S / ↓：戻って確認する', width / 2, height / 2 + 44);
        }
      }

      if (playerZ < 0.15 && !awaitingJudgement && !wrongReview && !gameClear) {
        const blink = 0.35 + 0.65 * Math.abs(Math.sin(performance.now() / 650));

        ctx.save();
        ctx.globalAlpha = blink;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 56px sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,.85)';
        ctx.shadowBlur = 10;
        ctx.fillText('↑ 前進してください', width / 2, 92);
        ctx.restore();
      }

      if (gameClear) {
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 420);

        ctx.fillStyle = 'rgba(0,0,0,.72)';
        ctx.fillRect(0, 0, width, height);

        // 柔らかい光
        const clearGlow = ctx.createRadialGradient(
          width / 2,
          height / 2,
          20,
          width / 2,
          height / 2,
          width * 0.38
        );
        clearGlow.addColorStop(0, `rgba(255,255,255,${0.18 + pulse * 0.08})`);
        clearGlow.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = clearGlow;
        ctx.fillRect(0, 0, width, height);

        ctx.textAlign = 'center';

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 72px sans-serif';
        ctx.shadowColor = 'rgba(255,255,255,.45)';
        ctx.shadowBlur = 18;
        ctx.fillText('安全確認完了', width / 2, height / 2 - 96);

        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,.95)';
        ctx.font = 'bold 44px sans-serif';
        ctx.fillText('CLEAR', width / 2, height / 2 - 24);

        ctx.fillStyle = 'rgba(255,255,255,.88)';
        ctx.font = '28px sans-serif';
        ctx.fillText('すべての工事区画を確認しました', width / 2, height / 2 + 44);

        ctx.font = 'bold 30px sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,.95)';
        const remaining = Math.max(0, anomalyTypes.length - discoveredAnomalies.size);
        ctx.fillText(
          remaining === 0 ? 'Complete！' : `未発見の異常：${remaining} 個`,
          width / 2,
          height / 2 + 88
        );

        ctx.font = '24px sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,.72)';
        ctx.fillText('Enter / Space：もう一度挑戦', width / 2, height / 2 + 140);
      }

      drawTransition();
    }

    function drawTransition() {
      if (!transition) return;

      if (transition.phase === 'fadeIn') {
        transition.alpha = Math.min(1, transition.alpha + 0.075);
      } else if (transition.phase === 'hold') {
        transition.alpha = 1;
      } else if (transition.phase === 'fadeOut') {
        transition.alpha = Math.max(0, transition.alpha - 0.075);
      }

      const isWrong = transition.type === 'wrong' || transition.type === 'wrongReset';
      ctx.fillStyle = isWrong
        ? `rgba(130, 0, 0, ${transition.alpha * 0.92})`
        : `rgba(0, 0, 0, ${transition.alpha * 0.92})`;

      ctx.fillRect(0, 0, width, height);

      if (transition.alpha > 0.72) {
        ctx.fillStyle = 'rgba(255,255,255,.88)';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';

        if (transition.type === 'wrong' || transition.type === 'wrongReset') {
          ctx.fillText('最初の通路へ……', width / 2, height / 2);
        } else if (transition.type === 'clear') {
          ctx.fillText('出口へ進む……', width / 2, height / 2);
        } else {
          ctx.fillText('次の区画へ……', width / 2, height / 2);
        }
      }
    }

    function drawTitleScreen() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, width, height);

      const elapsed = performance.now() - titleStartTime;
      const alpha = Math.min(1, elapsed / 500);

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 72px sans-serif';
      ctx.fillText('異常探し', width / 2, height / 2 - 20);

      ctx.font = 'bold 38px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      ctx.fillText('現場の不安全状態を見逃すな', width / 2, height / 2 + 52);
      ctx.restore();

      if (elapsed > 4000 && !titleFade) {
        titleFade = true;
        titleFadeStart = performance.now();
      }

      if (titleFade) {
        const fade = Math.min(1, (performance.now() - titleFadeStart) / 1200);

        ctx.fillStyle = `rgba(0,0,0,${fade})`;
        ctx.fillRect(0, 0, width, height);

        if (fade >= 1) {
          titleScreen = false;
          titleFade = false;
          showMessage('↑ 前進してください');
        }
      }
    }

    function loop() {
      if (titleScreen) {
        drawTitleScreen();
      } else {
        update();
        draw();
      }

      requestAnimationFrame(loop);
    }

    function updateTouchControlPosition() {
      const controls = document.querySelector('.touchControls');
      const hint = document.querySelector('.rotateHint');
      if (!controls) return;

      const viewport = window.visualViewport;
      const viewHeight = viewport ? viewport.height : window.innerHeight;
      const offsetTop = viewport ? viewport.offsetTop : 0;

      if (window.matchMedia('(pointer: coarse), (max-width: 900px)').matches) {
        const isLandscape = window.matchMedia('(orientation: landscape)').matches;
        controls.style.bottom = '';

        if (isLandscape) {
          controls.style.top = Math.max(0, offsetTop + viewHeight - controls.offsetHeight - 10) + 'px';
        } else {
          controls.style.top = Math.max(0, offsetTop + viewHeight - controls.offsetHeight - 8) + 'px';
        }

        if (hint) {
          hint.style.top = Math.max(72, offsetTop + 72) + 'px';
        }
      } else {
        controls.style.top = '';
      }
    }

    function handleAction(action) {
      if (gameClear) {
        resetGame();
        return;
      }

      if (transition) return;

      if (wrongReview) {
        if (action === 'safe') {
          wrongReview = false;
          startTransition('wrongReset', () => {
            currentFloor = 0;
            nextLoop();
            showMessage('最初の通路に戻された……');
          });
        }
        return;
      }

      if (!awaitingJudgement) return;

      if (action === 'abnormal') {
        judge(true);
      }

      if (action === 'safe') {
        judge(false);
      }
    }

    function setupTouchControls() {
      const buttons = document.querySelectorAll('.touchBtn');

      for (const btn of buttons) {
        if (btn.classList.contains('touchSpacer')) continue;

        const key = btn.dataset.key;
        const action = btn.dataset.action;

        const press = (e) => {
          e.preventDefault();

          if (key) {
            keys.add(key);
            btn.classList.add('active');
            return;
          }

          if (action) {
            handleAction(action);
          }
        };

        const release = (e) => {
          e.preventDefault();

          if (key) {
            keys.delete(key);
            btn.classList.remove('active');
          }
        };

        btn.addEventListener('pointerdown', press);
        btn.addEventListener('pointerup', release);
        btn.addEventListener('pointercancel', release);
        btn.addEventListener('pointerleave', release);
      }

      window.addEventListener('blur', () => keys.clear());
    }

    window.addEventListener('resize', resize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resize);
      window.visualViewport.addEventListener('scroll', resize);
    }
    window.addEventListener('keydown', (e) => {
      // クリア後はEnterかSpaceで即リスタート
      if (gameClear && (e.code === 'Enter' || e.code === 'Space')) {
        resetGame();
        return;
      }

      if (transition) return;

      if (wrongReview) {
        if (e.code === 'Enter') {
          wrongReview = false;
          startTransition('wrongReset', () => {
            currentFloor = 0;
            nextLoop();
            showMessage('最初の通路に戻された……');
          });
          return;
        }

        if (
          e.code === 'KeyS' ||
          e.code === 'ArrowDown' ||
          e.code === 'KeyW' ||
          e.code === 'ArrowUp' ||
          e.code === 'KeyA' ||
          e.code === 'KeyD'
        ) {
          keys.add(e.code);
        }

        return;
      }

      if (awaitingJudgement) {
        if (e.code === 'Space') {
          e.preventDefault();
          judge(true);
          return;
        }
        if (e.code === 'Enter') {
          if (currentFloor === 0 && !tutorialComplete) {
            tutorialComplete = true;
            awaitingJudgement = false;
            currentFloor++;
            nextLoop();
            showMessage('異常探し開始');
            return;
          }

          judge(false);
          return;
        }
        if (e.code === 'KeyS' || e.code === 'ArrowDown') {
          keys.add(e.code);
          return;
        }
        return;
      }

      keys.add(e.code);
    });
    window.addEventListener('keyup', (e) => keys.delete(e.code));
    document.getElementById('reset').addEventListener('click', resetGame);

    setupTouchControls();
    resize();
    resetGame();
    messageEl.classList.remove('show');
    titleScreen = true;
    titleStartTime = performance.now();
    loop();
  </script>
</body>
</html>
